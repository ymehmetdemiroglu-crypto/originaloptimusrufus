name: Optimus Rufus CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-test:
    name: Backend CI (FastAPI & Scraper)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff mypy hypothesis pydantic-settings structlog cachetools tenacity

      - name: Run Ruff Linter (Style Checks)
        run: |
          ruff check .

      - name: Run Ruff Formatter (Formatting Checks)
        run: |
          ruff format --check .

      - name: Run Pytest Suite with Coverage
        env:
          GEMINI_API_KEY: "mock-gemini-key"
          DISABLE_HTTPS_REDIRECT: "true"
        run: |
          pytest --cov=backend backend/tests/ --cov-fail-under=80

  dashboard-lint-and-build:
    name: Dashboard CI (Next.js)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rufus-dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd rufus-dashboard
          npm ci

      - name: Run Linter
        run: |
          cd rufus-dashboard
          npm run lint

      - name: Build Next.js Application
        run: |
          cd rufus-dashboard
          npm run build

  calculator-lint-and-build:
    name: Calculator CI (React Vite)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rufus-calculator/package-lock.json

      - name: Install Calculator Dependencies
        run: |
          cd rufus-calculator
          npm ci

      - name: Build React Application
        run: |
          cd rufus-calculator
          npm run build
