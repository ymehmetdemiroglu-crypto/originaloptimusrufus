version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - backend_data:/app/backend/data
      - cache_db:/app/backend/core # Persist local embedding cache sqlite
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - CORS_ALLOW_CREDENTIALS=true
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: rufus-dashboard/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
      - NODE_ENV=production
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  agent_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "acquisition-tool/cron_worker.py"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - APIFY_TOKEN=${APIFY_TOKEN}
      - APOLLO_API_KEY=${APOLLO_API_KEY}
      - APOLLO_SEQUENCE_ID=${APOLLO_SEQUENCE_ID}
      - APOLLO_SEND_FROM_EMAIL_ACCOUNT_ID=${APOLLO_SEND_FROM_EMAIL_ACCOUNT_ID}
      - OUTREACH_CATEGORY=${OUTREACH_CATEGORY:-supplements}
      - DAILY_ENRICH_LIMIT=${DAILY_ENRICH_LIMIT:-20}
      - AGENT_INTERVAL_HOURS=${AGENT_INTERVAL_HOURS:-24}
      - RUN_ON_STARTUP=${RUN_ON_STARTUP:-true}
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://backend:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  caddy:
    image: caddy:2.7-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  backend_data:
  cache_db:
  caddy_data:
  caddy_config:
